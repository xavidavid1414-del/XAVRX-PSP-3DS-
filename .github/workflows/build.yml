
name: Build XAVRX PSP 3DS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile XAVRX
        run: make

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: XAVRX-PSP-3DS
          path: |
            *.3dsx
            *.smdh
            
